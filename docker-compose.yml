services:
  fstpay-postgres:
    image: postgres:16-alpine
    container_name: fstpay-postgres
    profiles: ["core", "full"]
    environment:
      POSTGRES_DB: fstpay
      POSTGRES_USER: fstpay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fstpay_dev_pass_123}
    ports:
      - "5434:5432"
    volumes:
      - fstpay_pgdata:/var/lib/postgresql/data
    networks:
      - fstpay-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fstpay -d fstpay"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  fstpay-redis:
    image: redis:7-alpine
    container_name: fstpay-redis
    profiles: ["core", "full"]
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - fstpay_redis:/data
    networks:
      - fstpay-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  fstpay-kafka:
    image: bitnami/kafka:3.7.0
    container_name: fstpay-kafka
    profiles: ["messaging", "full"]
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@fstpay-kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - fstpay_kafka_data:/bitnami/kafka
    networks:
      - fstpay-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  fstpay-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fstpay-kafka-ui
    profiles: ["messaging", "full"]
    ports:
      - "8081:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=fstpay-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=fstpay-kafka:9092
    depends_on:
      fstpay-kafka:
        condition: service_healthy
    networks:
      - fstpay-network
    restart: unless-stopped

  fstpay-jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: fstpay-jaeger
    profiles: ["observability", "full"]
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - fstpay-network
    restart: unless-stopped

  fstpay-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fstpay-backend
    profiles: ["core", "full"]
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://fstpay-postgres:5432/fstpay
      - SPRING_DATASOURCE_USERNAME=fstpay
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-fstpay_dev_pass_123}
      - SPRING_REDIS_HOST=fstpay-redis
      - SPRING_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-a_very_secure_long_secret_key_for_jwt_token_signing_12345}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:80}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-fstpay-kafka:9092}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@fstpay.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@123456}
    depends_on:
      fstpay-postgres:
        condition: service_healthy
      fstpay-redis:
        condition: service_healthy
    networks:
      - fstpay-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  fstpay-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fstpay-frontend
    profiles: ["core", "full"]
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-/api/v1}
      - VITE_RECAPTCHA_SITE_KEY=${VITE_RECAPTCHA_SITE_KEY:-6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI}
    depends_on:
      fstpay-backend:
        condition: service_healthy
    networks:
      - fstpay-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  fstpay-network:
    name: fstpay-network
    driver: bridge

volumes:
  fstpay_pgdata:
    name: fstpay_pgdata
  fstpay_redis:
    name: fstpay_redis
  fstpay_kafka_data:
    name: fstpay_kafka_data
