name: Reusable Build Workflow

on:
  workflow_call:
    inputs:
      run-backend:
        description: 'Whether to run the backend build and test jobs'
        type: boolean
        default: false
      run-frontend:
        description: 'Whether to run the frontend build and test jobs'
        type: boolean
        default: false

jobs:
  backend-build:
    name: Backend Build & Test (JDK ${{ matrix.java-version }})
    if: ${{ inputs.run-backend }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17, 21]
        include:
          - java-version: 17
            required: true
          - java-version: 21
            required: false
      fail-fast: false

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fstpay
          POSTGRES_USER: fstpay
          POSTGRES_PASSWORD: fstpay_ci_secret
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # JDK 21 failures are informational; JDK 17 failures block the pipeline
    continue-on-error: ${{ !matrix.required }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Verify Code Compiles
      run: cd backend && mvn clean compile -q

    - name: Run Tests (Unit, Integration & ArchUnit)
      run: cd backend && mvn test
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5434/fstpay
        SPRING_DATASOURCE_USERNAME: fstpay
        SPRING_DATASOURCE_PASSWORD: fstpay_ci_secret
        SPRING_REDIS_HOST: localhost
        SPRING_REDIS_PORT: 6380
        JWT_SECRET: ci-test-jwt-secret-must-be-at-least-32-bytes-long-for-hmac
        SPRING_PROFILES_ACTIVE: test

    - name: Run OWASP Dependency Check (Informational)
      run: cd backend && mvn org.owasp:dependency-check-maven:check -DfailOnError=false -Dformat=HTML -q
      continue-on-error: true

    - name: Package JAR Artifact
      run: cd backend && mvn package -DskipTests -q

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar-jdk${{ matrix.java-version }}
        path: backend/target/*.jar
        retention-days: 7

    - name: Upload Test and Coverage Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-reports-jdk${{ matrix.java-version }}
        path: |
          backend/target/surefire-reports/
          backend/target/site/jacoco/
          backend/target/jacoco.xml
          backend/target/dependency-check-report.html
        retention-days: 7

  frontend-build:
    name: Frontend Build & Test
    if: ${{ inputs.run-frontend }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: cd frontend && npm ci

    - name: Lint Frontend
      run: cd frontend && npm run lint
      continue-on-error: true

    - name: Run Vitest Unit & Component Tests
      run: cd frontend && npm run test

    - name: Run Vitest Coverage
      run: cd frontend && npm run test:coverage
      continue-on-error: true

    - name: Run Frontend Security Audit (Informational)
      run: cd frontend && npm audit --audit-level=moderate
      continue-on-error: true

    - name: Build Production Bundle
      run: cd frontend && npm run build

    - name: Upload Frontend Artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist/
        retention-days: 7

    - name: Upload Frontend Coverage & Audit Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-reports
        path: |
          frontend/coverage/
        retention-days: 7
