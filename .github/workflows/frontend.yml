name: Frontend CI & E2E Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/frontend.yml'
      - '.github/workflows/reusable-build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/frontend.yml'
      - '.github/workflows/reusable-build.yml'

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-assets:
    uses: ./.github/workflows/reusable-build.yml
    with:
      run-backend: true
      run-frontend: true

  playwright-e2e:
    name: Playwright E2E Verification
    runs-on: ubuntu-latest
    needs: build-assets

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fstpay
          POSTGRES_USER: fstpay
          POSTGRES_PASSWORD: fstpay_ci_secret
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Download Backend JAR
      uses: actions/download-artifact@v4
      with:
        name: backend-jar-jdk17
        path: backend/target/

    - name: Start Backend Service
      run: |
        java -jar backend/target/*.jar --spring.profiles.active=test > backend.log 2>&1 &
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5434/fstpay
        SPRING_DATASOURCE_USERNAME: fstpay
        SPRING_DATASOURCE_PASSWORD: fstpay_ci_secret
        SPRING_REDIS_HOST: localhost
        SPRING_REDIS_PORT: 6380
        JWT_SECRET: ci-test-jwt-secret-must-be-at-least-32-bytes-long-for-hmac-ci

    - name: Wait for Backend Readiness
      run: |
        echo "Phase 1: Waiting for port 8080..."
        timeout 60 sh -c 'until nc -z localhost 8080; do sleep 1; done'
        echo "Port 8080 is open."

        echo "Phase 2: Verifying Actuator health status is UP..."
        for i in $(seq 1 20); do
          HEALTH=$(curl -sf http://localhost:8080/actuator/health 2>/dev/null || echo '{}')
          STATUS=$(echo "$HEALTH" | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [ "$STATUS" = "UP" ]; then
            echo "Backend health check passed: status=UP"
            exit 0
          fi
          echo "Attempt $i/20: status=$STATUS (waiting...)"
          sleep 3
        done
        echo "Backend failed to reach UP status. Log tail:"
        tail -100 backend.log
        exit 1

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: cd frontend && npm ci

    - name: Install Playwright Browsers
      run: cd frontend && npx playwright install --with-deps chromium

    - name: Start Frontend Dev Server
      run: |
        cd frontend && npm run dev &
        echo "Waiting for Vite dev server on port 5173..."
        timeout 30 sh -c 'until nc -z localhost 5173; do sleep 1; done'
        echo "Frontend dev server ready."

    - name: Run Playwright E2E Tests
      run: cd frontend && npx playwright test
      env:
        CI: true

    - name: Upload Playwright Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: |
          frontend/playwright-report/
          frontend/test-results/
        retention-days: 7

    - name: Upload Backend Log on Failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: backend-e2e-log
        path: backend.log
        retention-days: 7
