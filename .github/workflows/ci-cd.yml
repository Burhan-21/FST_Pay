name: FST Pay CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ── Backend: Build, Test, Verify ──
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fstpay
          POSTGRES_USER: fstpay
          POSTGRES_PASSWORD: fstpay_ci_secret
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Verify Code Compiles
      run: cd backend && mvn clean compile -q

    - name: Run Unit Tests
      run: cd backend && mvn test
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5434/fstpay
        SPRING_DATASOURCE_USERNAME: fstpay
        SPRING_DATASOURCE_PASSWORD: fstpay_ci_secret
        SPRING_REDIS_HOST: localhost
        SPRING_REDIS_PORT: 6380
        JWT_SECRET: ci-test-jwt-secret-must-be-at-least-32-bytes-long-for-hmac

    - name: Run Integration Tests
      run: cd backend && mvn test -Dtest="com.fstpay.integration.*" -DfailIfNoTests=false
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5434/fstpay
        SPRING_DATASOURCE_USERNAME: fstpay
        SPRING_DATASOURCE_PASSWORD: fstpay_ci_secret
        SPRING_REDIS_HOST: localhost
        SPRING_REDIS_PORT: 6380
        JWT_SECRET: ci-test-jwt-secret-must-be-at-least-32-bytes-long-for-hmac

    - name: Build JAR Artifact
      run: cd backend && mvn package -DskipTests -q

    - name: Upload Backend Artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: backend/target/*.jar
        retention-days: 7

  # ── Frontend: Lint, Test, Build ──
  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: cd frontend && npm ci

    - name: Lint
      run: cd frontend && npm run lint
      continue-on-error: true  # Don't block on lint warnings

    - name: Run Tests
      run: cd frontend && npm test -- --run

    - name: Build Production Bundle
      run: cd frontend && npm run build
      env:
        VITE_API_URL: https://fstpay-backend.onrender.com/api/v1

    - name: Upload Frontend Artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist
        retention-days: 7

  # ── Docker: Build Image (no push) ──
  docker:
    name: Docker Build Verify
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Backend Docker Image
      run: docker build -t fstpay-backend:ci ./backend

    - name: Build Frontend Docker Image
      run: docker build -t fstpay-frontend:ci ./frontend

    - name: Verify Docker Compose Config
      run: docker compose config --quiet
