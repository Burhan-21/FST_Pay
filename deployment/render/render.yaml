# Render Infrastructure as Code (Blueprint)
# Documentation: https://render.com/docs/blueprint-spec

databases:
  - name: fstpay-postgres
    databaseName: fstpay
    user: fstpay
    plan: starter
    region: oregon
    ipAllowList: [] # internal connections only

services:
  # Managed Redis for Token Caching & Rate Limiting
  - type: redis
    name: fstpay-redis
    plan: starter
    region: oregon
    ipAllowList: [] # internal connections only
    maxmemoryPolicy: allkeys-lru

  # Spring Boot 3.3.6 Backend Docker Web Service
  - type: web
    name: fstpay-backend
    env: docker
    region: oregon
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: fstpay-postgres
          property: connectionString
      - key: SPRING_REDIS_HOST
        fromService:
          type: redis
          name: fstpay-redis
          property: host
      - key: SPRING_REDIS_PORT
        fromService:
          type: redis
          name: fstpay-redis
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://fst-pay.vercel.app,http://localhost:5173
      - key: LOG_LEVEL
        value: INFO
      - key: ADMIN_EMAIL
        value: admin@fstpay.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: OUTBOX_DISPATCHER_TYPE
        value: spring
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
