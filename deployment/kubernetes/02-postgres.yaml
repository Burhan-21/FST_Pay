apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fstpay-postgres
  namespace: fstpay
spec:
  serviceName: fstpay-postgres
  replicas: 1
  selector:
    matchLabels:
      app: fstpay-postgres
  template:
    metadata:
      labels:
        app: fstpay-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: fstpay-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fstpay-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fstpay-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fstpay-postgres
  namespace: fstpay
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: fstpay-postgres
