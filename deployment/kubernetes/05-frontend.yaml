apiVersion: apps/v1
kind: Deployment
metadata:
  name: fstpay-frontend
  namespace: fstpay
  labels:
    app: fstpay-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fstpay-frontend
  template:
    metadata:
      labels:
        app: fstpay-frontend
    spec:
      containers:
        - name: frontend
          image: fstpay-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: fstpay-frontend
  namespace: fstpay
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: fstpay-frontend
