apiVersion: apps/v1
kind: Deployment
metadata:
  name: fstpay-redis
  namespace: fstpay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fstpay-redis
  template:
    metadata:
      labels:
        app: fstpay-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: fstpay-redis
  namespace: fstpay
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: fstpay-redis
