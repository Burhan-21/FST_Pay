apiVersion: v1
kind: ConfigMap
metadata:
  name: fstpay-config
  namespace: fstpay
data:
  SPRING_PROFILES_ACTIVE: "prod"
  LOG_LEVEL: "INFO"
  PORT: "8080"
  CORS_ALLOWED_ORIGINS: "https://fst-pay.vercel.app,https://pay.fstpay.com"
  OUTBOX_DISPATCHER_TYPE: "spring"
---
apiVersion: v1
kind: Secret
metadata:
  name: fstpay-secrets
  namespace: fstpay
type: Opaque
stringData:
  POSTGRES_DB: "fstpay"
  POSTGRES_USER: "fstpay"
  POSTGRES_PASSWORD: "change_me_to_a_strong_password"
  JWT_SECRET: "change_me_to_a_secure_base64_jwt_key_at_least_256_bits"
  ADMIN_EMAIL: "admin@fstpay.com"
  ADMIN_PASSWORD: "AdminSecurePassword123!"
  RECAPTCHA_SECRET_KEY: "recaptcha_secret_placeholder"
  GEMINI_API_KEY: "gemini_api_key_placeholder"
  MAIL_USERNAME: "smtp_user_placeholder"
  MAIL_PASSWORD: "smtp_password_placeholder"
