apiVersion: apps/v1
kind: Deployment
metadata:
  name: fstpay-backend
  namespace: fstpay
  labels:
    app: fstpay-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fstpay-backend
  template:
    metadata:
      labels:
        app: fstpay-backend
    spec:
      containers:
        - name: backend
          image: fstpay-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: fstpay-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://fstpay-postgres.fstpay.svc.cluster.local:5432/fstpay"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fstpay-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fstpay-secrets
                  key: POSTGRES_PASSWORD
            - name: SPRING_REDIS_HOST
              value: "fstpay-redis.fstpay.svc.cluster.local"
            - name: SPRING_REDIS_PORT
              value: "6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fstpay-secrets
                  key: JWT_SECRET
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: fstpay-secrets
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fstpay-secrets
                  key: ADMIN_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 35
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: fstpay-backend
  namespace: fstpay
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: fstpay-backend
